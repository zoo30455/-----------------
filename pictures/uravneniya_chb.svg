<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, sans-serif" fill="#000">
<rect width="1200" height="700" fill="#fff"/>
<text x="600.0" y="55" font-size="38" font-weight="bold" text-anchor="middle">Простые уравнения: найди x</text>
<rect x="40" y="90" width="540" height="235" rx="14" fill="none" stroke="#000" stroke-width="3"/>
<circle cx="90" cy="135" r="28" fill="#000"/>
<text x="90" y="149" font-size="40" font-weight="bold" text-anchor="middle" fill="#fff">+</text>
<text x="135" y="145" font-size="28" font-weight="bold">СЛОЖЕНИЕ</text>
<text x="310.0" y="200" font-size="44" font-weight="bold" text-anchor="middle">x + a = b</text>
<text x="310.0" y="235" font-size="20" text-anchor="middle">обратное действие: вычитание</text>
<text x="310.0" y="280" font-size="40" font-weight="bold" text-anchor="middle">x = b − a</text>
<text x="310.0" y="310" font-size="20" text-anchor="middle">x + 3 = 7  →  x = 7 − 3 = 4</text>
<rect x="620" y="90" width="540" height="235" rx="14" fill="none" stroke="#000" stroke-width="3"/>
<circle cx="670" cy="135" r="28" fill="#000"/>
<text x="670" y="149" font-size="40" font-weight="bold" text-anchor="middle" fill="#fff">−</text>
<text x="715" y="145" font-size="28" font-weight="bold">ВЫЧИТАНИЕ</text>
<text x="890.0" y="200" font-size="44" font-weight="bold" text-anchor="middle">x − a = b</text>
<text x="890.0" y="235" font-size="20" text-anchor="middle">обратное действие: сложение</text>
<text x="890.0" y="280" font-size="40" font-weight="bold" text-anchor="middle">x = b + a</text>
<text x="890.0" y="310" font-size="20" text-anchor="middle">x − 3 = 4  →  x = 4 + 3 = 7</text>
<rect x="40" y="340" width="540" height="235" rx="14" fill="none" stroke="#000" stroke-width="3"/>
<circle cx="90" cy="385" r="28" fill="#000"/>
<text x="90" y="399" font-size="40" font-weight="bold" text-anchor="middle" fill="#fff">×</text>
<text x="135" y="395" font-size="28" font-weight="bold">УМНОЖЕНИЕ</text>
<text x="310.0" y="450" font-size="44" font-weight="bold" text-anchor="middle">a · x = b</text>
<text x="310.0" y="485" font-size="20" text-anchor="middle">обратное действие: деление</text>
<text x="310.0" y="530" font-size="40" font-weight="bold" text-anchor="middle">x = b ÷ a</text>
<text x="310.0" y="560" font-size="20" text-anchor="middle">3 · x = 12  →  x = 12 ÷ 3 = 4</text>
<rect x="620" y="340" width="540" height="235" rx="14" fill="none" stroke="#000" stroke-width="3"/>
<circle cx="670" cy="385" r="28" fill="#000"/>
<text x="670" y="399" font-size="40" font-weight="bold" text-anchor="middle" fill="#fff">÷</text>
<text x="715" y="395" font-size="28" font-weight="bold">ДЕЛЕНИЕ</text>
<text x="890.0" y="450" font-size="44" font-weight="bold" text-anchor="middle">x ÷ a = b</text>
<text x="890.0" y="485" font-size="20" text-anchor="middle">обратное действие: умножение</text>
<text x="890.0" y="530" font-size="40" font-weight="bold" text-anchor="middle">x = b · a</text>
<text x="890.0" y="560" font-size="20" text-anchor="middle">x ÷ 3 = 4  →  x = 4 · 3 = 12</text>
<line x1="582" y1="207.5" x2="578" y2="207.5" stroke="#000" stroke-width="3"/>
<line x1="582" y1="207.5" x2="618" y2="207.5" stroke="#000" stroke-width="3"/>
<polygon points="578,207.5 590,199.5 590,215.5" fill="#000"/>
<polygon points="622,207.5 610,199.5 610,215.5" fill="#000"/>
<line x1="582" y1="457.5" x2="578" y2="457.5" stroke="#000" stroke-width="3"/>
<line x1="582" y1="457.5" x2="618" y2="457.5" stroke="#000" stroke-width="3"/>
<polygon points="578,457.5 590,449.5 590,465.5" fill="#000"/>
<polygon points="622,457.5 610,449.5 610,465.5" fill="#000"/>
<text x="600.0" y="615" font-size="24" text-anchor="middle">Чтобы найти x, сделай обратное действие: сложение ↔ вычитание, умножение ↔ деление.</text>
<text x="600.0" y="655" font-size="24" text-anchor="middle">Проверка: подставь x в уравнение — равенство должно получиться верным.</text>
</svg>