<text x="797" y="215" font-size="24" font-weight="bold" text-anchor="middle">×10</text>
<line x1="820" y1="235" x2="775" y2="235" stroke="#000" stroke-width="3"/>
<polygon points="770,235 784,227 784,243" fill="#000"/>
<text x="770" y="415" font-size="22" text-anchor="middle">10 единиц = 1 десяток</text>
<text x="400" y="415" font-size="22" text-anchor="middle">10 десятков = 1 сотня</text>
<rect x="105" y="440" width="200" height="110" fill="none" stroke="#000" stroke-width="3"/>
<text x="205.0" y="575" font-size="20" text-anchor="middle">цифра в этом разряде</text>
