<rect x="895" y="440" width="200" height="110" fill="none" stroke="#000" stroke-width="3"/>
<text x="995.0" y="575" font-size="20" text-anchor="middle">цифра в этом разряде</text>
<text x="600.0" y="625" font-size="24" text-anchor="middle">Число читается слева направо: сначала сотни, потом десятки, потом единицы.</text>
<text x="600.0" y="662" font-size="24" text-anchor="middle">Каждый разряд в 10 раз больше соседнего справа.</text>
